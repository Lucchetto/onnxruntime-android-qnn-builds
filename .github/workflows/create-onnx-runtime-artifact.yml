name: Create ONNX Runtime artifact

on: 
  workflow_call:
    outputs:
      artifact-name: 
        description: 'Generated artifact''s name'
        value: ${{ jobs.build.outputs.artifact-name }}

jobs:

  build:
    runs-on: ubuntu-22.04
    outputs:
      artifact-name: ${{ steps.set-outputs.outputs.artifact-name }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17 (required for Android builds)
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Python 3.11.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11.11'
      
      - name: Load config env
        run: cat config.env >> $GITHUB_ENV

      - name: Set up Android SDK ${{ env.ANDROID_SDK_VERSION }}
        uses: android-actions/setup-android@v3

      - name: Install required Android SDK components
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platform-tools" "platforms;android-${{ env.ANDROID_SDK_VERSION }}" "build-tools;${{ env.ANDROID_SDK_VERSION }}.0.0"

      - name: Install Android NDK ${{ env.ANDROID_NDK_VERSION }}
        run: |
          sdkmanager "ndk;${{ env.ANDROID_NDK_VERSION }}"
          echo "NDK_ROOT=$ANDROID_HOME/ndk/${{ env.ANDROID_NDK_VERSION }}" >> $GITHUB_ENV

      - name: Install patch utility and ninja-build
        run: |
          sudo apt-get update
          sudo apt-get install -y patch ninja-build

      - name: Get repository name
        run: |
          echo "REPO_NAME=${GITHUB_REPOSITORY#*/}" >> $GITHUB_ENV

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ env.REPO_NAME }}_android_arm64-v8a
          max-size: 1024M

      - name: Clone ONNX Runtime at version ${{ env.ONNXRUNTIME_VERSION }}
        run: |
          git clone --branch v${{ env.ONNXRUNTIME_VERSION }} --depth 1 https://github.com/microsoft/onnxruntime.git

      - name: Apply QNN EP Reshape Transpose Fusion revert patch
        run: |
          git apply --check ../0001-Revert-QNN-EP-Reshape-Transpose-Fusion-for-6D-tensor.patch
          git apply ../0001-Revert-QNN-EP-Reshape-Transpose-Fusion-for-6D-tensor.patch
        working-directory: onnxruntime

      - name: Download and extract Qualcomm Neural Processing SDK ${{ env.QNN_SDK_VERSION }}
        run: |
          wget -O qnn_sdk.zip "https://softwarecenter.qualcomm.com/api/download/software/sdks/Qualcomm_AI_Runtime_Community/All/${{ env.QNN_SDK_VERSION }}/v${{ env.QNN_SDK_VERSION }}.zip"
          unzip qnn_sdk.zip -d $HOME/qnn_sdk
          rm qnn_sdk.zip

      - name: Build ONNX Runtime for Android arm64-v8a with QNN support
        env:
          CCACHE_COMPILERCHECK: content
        run: |
          python3 tools/ci_build/build.py --build_shared_lib --skip_submodule_sync --android \
            --config Release --parallel --use_qnn static_lib \
            --qnn_home $HOME/qnn_sdk/qairt/${{ env.QNN_SDK_VERSION }}/ \
            --android_sdk_path ${{ env.ANDROID_HOME }} \
            --android_ndk_path ${{ env.ANDROID_HOME }}/ndk/${{ env.ANDROID_NDK_VERSION }} \
            --android_abi arm64-v8a --android_api ${{ env.ANDROID_MIN_SDK_VERSION }} \
            --cmake_generator Ninja --allow_running_as_root --use_cache \
            --skip_tests \
            --cmake_extra_defines=onnxruntime_BUILD_UNIT_TESTS=OFF \
            --build_dir build/android/arm64-v8a
        working-directory: onnxruntime
      
      - name: Combine static libraries into a single libonnxruntime.a
        run: |
          NDK_BIN="${{ env.ANDROID_HOME }}/ndk/${{ env.ANDROID_NDK_VERSION }}/toolchains/llvm/prebuilt/linux-x86_64/bin"
          RELEASE_DIR="build/android/arm64-v8a/Release"
          cd "$RELEASE_DIR"
          # Internal ORT component archives (onnxruntime_session, onnxruntime_optimizer,
          # onnxruntime_providers, onnxruntime_providers_qnn, ...). Pull EVERY object
          # via --whole-archive so no member is lost to same-basename collisions.
          # onnxruntime_optimizer.a contains TWO members named utils.cc.o:
          #   core/optimizer/utils.cc
          #   core/optimizer/qdq_transformer/selectors_actions/shared/utils.cc
          # The latter defines onnxruntime::QDQ::GetAllNodeUnits, which the QNN EP
          # and provider_bridge_ort.cc call. Extracting with `ar x` flattens both to
          # the same filename and silently drops one, producing the
          # "undefined symbol: onnxruntime::QDQ::GetAllNodeUnits" link error.
          # Passing the archives directly to ld -r (with --whole-archive) preserves
          # every member's distinct path-qualified name, so nothing is lost.
          find . -maxdepth 1 -name '*.a' ! -name 'libonnxruntime.a' > internal.rsp
          # External dependency archives (protobuf, onnx, re2, absl, flatbuffers,
          # cpuinfo, kleidiai) live under _deps/. Pass them as archives WITHOUT
          # --whole-archive so the linker pulls only the referenced members
          # (dead-code pruning) and resolves symbols like
          # onnx::GraphProto::GraphProto(...) from libonnx_proto.a.
          # --start-group/--end-group handles circular deps between them.
          find _deps -name '*.a' > deps.rsp
          "$NDK_BIN/ld.lld" -r -o prelinked_objects.o \
            --whole-archive @internal.rsp --no-whole-archive \
            --start-group @deps.rsp --end-group
          # Archive the pre-linked object into a single static library.
          "$NDK_BIN/llvm-ar" rcs libonnxruntime.a prelinked_objects.o
        working-directory: onnxruntime

      - name: Zip the files
        run: |
          zip onnxruntime-android-qnn.zip onnxruntime/build/android/arm64-v8a/Release/libonnxruntime.a onnxruntime/build/android/arm64-v8a/Release/libonnxruntime.so

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.REPO_NAME }}_${{ github.sha }}
          path: onnxruntime-android-qnn.zip

      - name: Set outputs
        id: set-outputs
        run: echo "artifact-name=${REPO_NAME}_${GITHUB_SHA}" >> $GITHUB_OUTPUT
